[package]
name = "adtb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adtb-exec.workspace = true
adtb-file.workspace = true
adtb-heap.workspace = true
adtb-lang.workspace = true
adtb-store.workspace = true
adtb-sys.workspace = true
blake3 = { version = "1.8.3", default-features = false }
unicode-normalization = { version = "0.1.26", default-features = false }

[features]
latch-checks = ["adtb-heap/latch-checks", "adtb-sys/latch-checks"]
testing = ["adtb-exec/testing", "adtb-heap/testing", "adtb-lang/testing", "adtb-store/testing"]

[lints]
workspace = true

[dev-dependencies]
adtb-exec = { workspace = true, features = ["testing"] }
adtb-heap = { workspace = true, features = ["testing"] }
adtb-heap-cap.workspace = true
adtb-lang = { workspace = true, features = ["test-heap-cap", "testing"] }
adtb-reference.workspace = true
adtb-sim.workspace = true
adtb-store = { workspace = true, features = ["testing"] }
adtb-testkit = { workspace = true, features = ["sim"] }

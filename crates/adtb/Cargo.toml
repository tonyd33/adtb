[package]
name = "adtb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adtb-file.workspace = true
adtb-lang.workspace = true
adtb-reference = { workspace = true, optional = true }
adtb-sys.workspace = true
adtb-testkit = { workspace = true, optional = true }
blake3 = { version = "1.8.3", default-features = false }
icu_casemap = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_collator = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.4.0", default-features = false }
icu_segmenter = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
unicode-normalization = { version = "0.1.26", default-features = false }

[features]
plan-fixture = ["dep:adtb-reference", "dep:adtb-testkit"]

[lints]
workspace = true

[dev-dependencies]
adtb-reference.workspace = true
adtb-testkit.workspace = true

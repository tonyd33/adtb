[package]
name = "adtb-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adtb-lang.workspace = true
adtb-sys.workspace = true
blake3 = { version = "1.8.3", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "stream"] }
argon2 = { version = "0.5.3", default-features = false, features = ["zeroize"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
unicode-normalization = { version = "0.1.26", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[features]
testing = ["adtb-lang/testing"]

[lints]
workspace = true

[dev-dependencies]
adtb-heap-cap.workspace = true
adtb-lang = { workspace = true, features = ["test-heap-cap", "testing"] }
adtb-sim.workspace = true
adtb-testkit = { workspace = true, features = ["sim"] }

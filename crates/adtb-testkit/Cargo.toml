[package]
name = "adtb-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
sim = ["dep:adtb-sim", "dep:adtb-sys"]

[dependencies]
adtb-lang.workspace = true
adtb-reference.workspace = true
adtb-script.workspace = true
adtb-sim = { workspace = true, optional = true }
adtb-sys = { workspace = true, optional = true }
unicode-normalization = { version = "0.1.26", default-features = false }

[dev-dependencies]
adtb-lang = { workspace = true, features = ["test-heap-cap"] }
adtb = { workspace = true, features = ["testing"] }
adtb-conformance.workspace = true
adtb-testkit = { path = ".", features = ["sim"] }

[lints]
workspace = true

[package.metadata.adtb]
test-support = true

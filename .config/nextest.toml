# The default run stays under 20 seconds a test; a test still running at 60 is killed. The walks
# of six migrations belong to the deep profile.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 3 }
default-filter = "not (binary(=differential) and (test(=every_schema_walk_keeps_engine_equal_to_reference) or test(=every_operator_keeps_its_laws)))"

# Runs a shell over every manual page, about 40 s under load.
[[profile.default.overrides]]
filter = "test(=every_page_prints_what_it_shows)"
slow-timeout = { period = "60s", terminate-after = 3 }

# Lists and starts every test binary, and builds them when an earlier step did not.
[[profile.default.overrides]]
filter = "test(=every_test_binary_has_the_heap_cap)"
slow-timeout = { period = "60s", terminate-after = 10 }

# A test that calls `raise_cap` holds the slots its cap covers: the cap over the default, rounded up.
[[profile.default.overrides]]
filter = "test(=truncated_open::a_cut_that_loses_a_later_bitmap_group_refuses_the_select)"
threads-required = 3

[[profile.default.overrides]]
filter = "test(=lost_bitmap::a_cut_losing_a_group_with_large_values_refuses_marks_and_stays_marked)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=lost_bitmap::a_blank_status_page_refuses_and_never_aborts_committed_rows)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=lost_bitmap::no_crash_while_crossing_a_group_refuses_a_healthy_file)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=lost_bitmap::a_crash_in_recovery_then_a_cut_never_reuses_a_named_page)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=reindex::a_crash_at_each_stage_keeps_an_index_that_finds_every_row_and_leaks_nothing)"
threads-required = 2

# An area test of the engine scripts runs three scripts at once.
[[profile.default.overrides]]
filter = "package(=adtb-sim) and binary(=sim) and test(=scripts::oplog)"
threads-required = 3

# A test that spawns a capped binary belongs to the group naming the slots it holds. `test_child`
# reads the group and divides those slots among its children; it panics in any other group.
[[profile.default.overrides]]
filter = "test(=a_raised_cap_lets_the_test_pass_the_default)"
threads-required = 3
test-group = "slots-3"

[[profile.default.overrides]]
filter = "binary(/^(shell|manual|probe|usage|engine|cap)$/) or test(=tests::the_nested_list_drops_the_callers_profile)"
threads-required = 2
test-group = "slots-2"

[[profile.default.overrides]]
filter = """
package(=adtb-sim) and binary(=sim) and (
  test(=server_adhoc::a_chain_of_different_ors_runs_on_the_reduced_stack) or
  test(=server_adhoc::a_chain_of_match_arms_runs_to_its_limit) or
  test(=server_adhoc::a_comprehension_chain_runs_to_its_limit) or
  test(=server_adhoc::a_function_chain_over_sets_runs_to_its_limit) or
  test(=server_adhoc::a_function_chain_runs_to_its_limit) or
  test(=server_adhoc::a_long_chain_of_lets_answers_and_does_not_take_the_stack) or
  test(=server_adhoc::a_long_chain_of_operators_answers_and_does_not_take_the_stack) or
  test(=server_adhoc::a_match_chain_runs_to_its_limit) or
  test(=server_adhoc::a_nesting_of_fixpoints_at_its_limit_runs_on_the_reduced_stack) or
  test(=server_adhoc::a_record_nesting_runs_to_its_limit) or
  test(=server_adhoc::a_set_nesting_runs_to_its_limit) or
  test(=server_adhoc::a_transact_of_a_thousand_inserts_runs_and_explains_on_the_reduced_stack) or
  test(=server_adhoc::a_type_one_level_past_its_limit_is_refused_for_its_height) or
  test(=server_adhoc::a_very_deep_type_is_refused_on_a_default_stack) or
  test(=server_adhoc::a_wide_doubling_at_its_limit_runs_on_the_reduced_stack) or
  test(=server_adhoc::a_write_at_the_height_limit_checks_its_constraint_on_the_reduced_stack) or
  test(=server_adhoc::an_aggregate_at_the_height_limit_runs_on_the_reduced_stack) or
  test(=server_adhoc::an_export_at_the_height_limit_runs_on_the_reduced_stack) or
  test(=server_adhoc::an_if_chain_runs_to_its_limit) or
  test(=server_adhoc::an_operator_chain_runs_to_its_limit) or
  test(=server_adhoc::explain_at_the_height_limit_runs_on_the_reduced_stack) or
  test(=server_adhoc::fused_loops_under_the_run_bound_run_on_the_reduced_stack)
)
"""
threads-required = 2
test-group = "slots-2"

[[profile.default.overrides]]
filter = """
package(=adtb-bench) and binary(=adtb_bench) and (
  test(=native::driver::crash_tests::adtb_acknowledged_prefix) or
  test(=native::driver::crash_tests::sqlite_acknowledged_prefix)
)
"""
threads-required = 2
test-group = "slots-2"

[test-groups.slots-2]
max-threads = 64

[test-groups.slots-3]
max-threads = 64

# For iteration: one seed per `profile::sweep` sweep, and no crash sweeps.
[profile.quick]
default-filter = "not test(/crash/) and not (binary(=differential) and (test(=every_schema_walk_keeps_engine_equal_to_reference) or test(=every_operator_keeps_its_laws)))"

# Every sweep at `profile::DEEP` times its default count of seeds or cases.
[profile.deep]
default-filter = "all()"
slow-timeout = { period = "120s", terminate-after = 10 }

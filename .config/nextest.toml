# A test still running at 20 seconds is reported slow and at 300 is killed as hung. The walks
# of six migrations and the pager crash table's cells beyond its rows belong to the deep profile,
# the damage search but its pinned cases to the damage and deep ones.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 15 }
default-filter = "not (binary(=differential) and (test(=every_schema_walk_keeps_engine_equal_to_reference) or test(=every_operator_keeps_its_laws))) and not (binary(=storage) and test(/^damage_search::/) and not test(=damage_search::a_pinned_known_failure_still_shows) and not test(=damage_search::a_pinned_case_of_each_row_asks_it_and_breaks_no_rule)) and not (package(=adtb) and test(/^storage::pager_tests::every_cell_/))"

# Lists and starts every test binary, and builds them when an earlier step did not.
[[profile.default.overrides]]
filter = "test(=every_test_binary_has_the_heap_cap)"
slow-timeout = { period = "60s", terminate-after = 10 }

# The damage search's pinned cases run four at once.
[[profile.default.overrides]]
filter = "binary(=storage) and test(=damage_search::a_pinned_case_of_each_row_asks_it_and_breaks_no_rule)"
threads-required = 4

# A test that calls `raise_cap` holds the slots its cap covers: the cap over the default, rounded up.
[[profile.default.overrides]]
filter = "test(=truncated_open::a_cut_that_loses_a_later_bitmap_group_refuses_the_select)"
threads-required = 3

[[profile.default.overrides]]
filter = "test(=storage::lost_bitmap_tests::a_blank_or_cut_status_page_of_committed_rows_refuses_the_select_and_marks_the_database)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=storage::lost_bitmap_tests::no_crash_while_crossing_a_group_refuses_a_healthy_file)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=storage::lost_bitmap_tests::a_crash_in_recovery_then_a_cut_never_reuses_a_named_page)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=reindex::a_crash_at_each_stage_keeps_an_index_that_finds_every_row_and_leaks_nothing)"
threads-required = 2

# An area test of the engine scripts runs three scripts at once.
[[profile.default.overrides]]
filter = "package(=adtb-sim) and binary(=scripted) and (test(=scripts::oplog_0) | test(=scripts::oplog_1) | test(=scripts::oplog_2) | test(=scripts::bundles_0) | test(=scripts::bundles_1) | test(=scripts::bundles_2) | test(=scripts::bundles_3) | test(=scripts::bundles_4) | test(=scripts::roles_0) | test(=scripts::roles_1) | test(=scripts::authority) | test(=scripts::registered) | test(=scripts::registration_0) | test(=scripts::registration_1) | test(=scripts::commands) | test(=scripts::api) | test(=scripts::past) | test(=scripts::plans) | test(=scripts::longkey) | test(=scripts::catalog_0) | test(=scripts::catalog_1) | test(=scripts::dump) | test(=scripts::faults) | test(=scripts::admission) | test(=scripts::execution))"
threads-required = 3

[[profile.default.overrides]]
filter = "test(=a_raised_cap_lets_the_test_pass_the_default)"
threads-required = 3

# The comparison of the migration model with the operator layer runs on four threads.
[[profile.default.overrides]]
filter = "package(=adtb-lang) and test(=evolve::tests::laws::the_migration_model_agrees_with_the_layer_on_the_cases_and_the_script_corpus)"
threads-required = 4

# For iteration: one seed per `profile::sweep` sweep, and no crash sweeps.
[profile.quick]
default-filter = "not test(/crash/) and not (binary(=differential) and (test(=every_schema_walk_keeps_engine_equal_to_reference) or test(=every_operator_keeps_its_laws))) and not (binary(=storage) and test(/^damage_search::/) and not test(=damage_search::a_pinned_known_failure_still_shows) and not test(=damage_search::a_pinned_case_of_each_row_asks_it_and_breaks_no_rule))"

# The damage search's per-change tier: one case of each page kind and fault. The default profile
# runs its pinned cases.
[profile.damage]
default-filter = "binary(=storage) and test(/^damage_search::/) and not test(=damage_search::a_pinned_known_failure_still_shows) and not test(=damage_search::a_pinned_case_of_each_row_asks_it_and_breaks_no_rule)"
slow-timeout = { period = "120s", terminate-after = 5 }

# The damage search tests start longest first.
[[profile.damage.overrides]]
filter = "binary(=storage) and test(=damage_search::a_lost_write_of_an_earlier_incarnation_judges_nothing_of_the_next)"
priority = 10

[[profile.damage.overrides]]
filter = "binary(=storage) and test(=damage_search::a_lost_write_whose_log_is_recycled_is_still_reported)"
priority = 9

[[profile.damage.overrides]]
filter = "binary(=storage) and test(=damage_search::a_page_unreadable_once_is_a_storage_failure_then_intact)"
priority = 8

[[profile.damage.overrides]]
filter = "binary(=storage) and test(=damage_search::a_flipped_byte_of_a_page_is_refused_and_marked)"
priority = 7

[[profile.damage.overrides]]
filter = "binary(=storage) and test(=damage_search::a_lost_write_of_a_live_page_is_reported_and_marked)"
priority = 6

[[profile.damage.overrides]]
filter = "binary(=storage) and test(=damage_search::a_page_unreadable_for_good_is_a_storage_failure_that_marks_nothing)"
priority = 5

[[profile.damage.overrides]]
filter = "binary(=storage) and (test(=damage_search::a_torn_write_is_restored_from_its_image) or test(/^damage_search::a_vacuum_beside_each_write_/))"
priority = 4

# A damage search test runs four plans or cases at once.
[[profile.damage.overrides]]
filter = "binary(=storage) and test(/^damage_search::/)"
threads-required = 4

# Every sweep at `profile::DEEP` times its default count of seeds or cases.
[profile.deep]
default-filter = "all()"
slow-timeout = { period = "120s", terminate-after = 10 }

# The damage search at 32 cases of each page kind and fault, asking every row of the stated table,
# with its pairs and its concurrent tier.
[[profile.deep.overrides]]
filter = "binary(=storage) and test(/^damage_search::/)"
slow-timeout = { period = "300s", terminate-after = 12 }
threads-required = 4

# The generated migrations search runs four cases at once under the deep profile.
[[profile.deep.overrides]]
filter = "binary(=differential) and test(=migrations::generated_migrations_keep_their_invariants)"
threads-required = 4

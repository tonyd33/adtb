# A test still running at 20 seconds is reported slow and at 300 is killed as hung. The walks
# of six migrations and the pager crash table's cells beyond its rows belong to the deep profile,
# the damage search but one pinned case of it to the damage and deep ones.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 15 }
default-filter = "not (binary(=differential) and (test(=every_schema_walk_keeps_engine_equal_to_reference) or test(=every_operator_keeps_its_laws))) and not (binary(=storage) and test(/^damage_search::/) and not test(=damage_search::a_pinned_known_failure_still_shows)) and not (package(=adtb) and test(/^storage::pager_tests::every_cell_/))"

# Lists and starts every test binary, and builds them when an earlier step did not.
[[profile.default.overrides]]
filter = "test(=every_test_binary_has_the_heap_cap)"
slow-timeout = { period = "60s", terminate-after = 10 }

# A test that calls `raise_cap` holds the slots its cap covers: the cap over the default, rounded up.
[[profile.default.overrides]]
filter = "test(=truncated_open::a_cut_that_loses_a_later_bitmap_group_refuses_the_select)"
threads-required = 3

[[profile.default.overrides]]
filter = "test(=storage::lost_bitmap_tests::a_cut_losing_a_group_with_large_values_refuses_marks_and_stays_marked)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=storage::lost_bitmap_tests::a_blank_status_page_refuses_and_never_aborts_committed_rows)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=storage::lost_bitmap_tests::no_crash_while_crossing_a_group_refuses_a_healthy_file)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=storage::lost_bitmap_tests::a_crash_in_recovery_then_a_cut_never_reuses_a_named_page)"
threads-required = 2

[[profile.default.overrides]]
filter = "test(=reindex::a_crash_at_each_stage_keeps_an_index_that_finds_every_row_and_leaks_nothing)"
threads-required = 2

# An area test of the engine scripts runs three scripts at once.
[[profile.default.overrides]]
filter = "package(=adtb-sim) and binary(=scripted) and (test(=scripts::oplog_0) | test(=scripts::oplog_1) | test(=scripts::oplog_2) | test(=scripts::bundles_0) | test(=scripts::bundles_1) | test(=scripts::bundles_2) | test(=scripts::bundles_3) | test(=scripts::bundles_4) | test(=scripts::roles_0) | test(=scripts::roles_1) | test(=scripts::authority) | test(=scripts::registered) | test(=scripts::registration_0) | test(=scripts::registration_1) | test(=scripts::commands) | test(=scripts::api) | test(=scripts::past) | test(=scripts::longkey) | test(=scripts::dump) | test(=scripts::faults))"
threads-required = 3

[[profile.default.overrides]]
filter = "test(=a_raised_cap_lets_the_test_pass_the_default)"
threads-required = 3

# For iteration: one seed per `profile::sweep` sweep, and no crash sweeps.
[profile.quick]
default-filter = "not test(/crash/) and not (binary(=differential) and (test(=every_schema_walk_keeps_engine_equal_to_reference) or test(=every_operator_keeps_its_laws))) and not (binary(=storage) and test(/^damage_search::/) and not test(=damage_search::a_pinned_known_failure_still_shows))"

# The damage search's per-change tier: eight cases of each page kind and fault.
[profile.damage]
default-filter = "binary(=storage) and test(/^damage_search::/)"
slow-timeout = { period = "120s", terminate-after = 5 }

# The slowest damage search test starts first.
[[profile.damage.overrides]]
filter = "binary(=storage) and test(=damage_search::a_lost_write_of_an_earlier_incarnation_judges_nothing_of_the_next)"
priority = 10

# A damage search test runs four plans or cases at once.
[[profile.damage.overrides]]
filter = "binary(=storage) and test(/^damage_search::/)"
threads-required = 4

# Every sweep at `profile::DEEP` times its default count of seeds or cases.
[profile.deep]
default-filter = "all()"
slow-timeout = { period = "120s", terminate-after = 10 }

# The damage search at 32 cases of each page kind and fault, with its pairs and its concurrent tier.
[[profile.deep.overrides]]
filter = "binary(=storage) and test(/^damage_search::/)"
slow-timeout = { period = "300s", terminate-after = 12 }
threads-required = 4

[book]
title = "adtb documentation"
language = "en"
src = "docs"

[build]
build-dir = "target/docs-site/html"
create-missing = false
# The index preprocessor renames README pages while links keep README.html.
use-default-preprocessors = false

[preprocessor.links]

[output.html]
no-section-label = true
additional-js = ["tools/docs-site/adt-highlight.js"]

[output.html.playground]
runnable = false

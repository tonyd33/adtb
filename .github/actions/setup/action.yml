name: Setup
description: Install Nix and load the devenv shell into the job env via direnv.

inputs:
  cachix-auth-token:
    description: Cachix auth token
    required: false

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - uses: cachix/cachix-action@v17
      with:
        name: adtb
        authToken: ${{ inputs.cachix-auth-token }}

    - name: Install devenv.sh
      shell: bash
      run: nix profile add nixpkgs#devenv

    - name: Install direnv
      shell: bash
      run: nix profile add nixpkgs#direnv

    - name: Load shell into env
      shell: bash
      run: |
        direnv allow .
        direnv export gha | tee -a "$GITHUB_ENV"

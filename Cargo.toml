[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
adtdb = { path = "crates/adtdb" }
adtdb-lang = { path = "crates/adtdb-lang" }
adtdb-reference = { path = "crates/adtdb-reference" }
adtdb-sim = { path = "crates/adtdb-sim" }
adtdb-sys = { path = "crates/adtdb-sys" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
disallowed_methods = "deny"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
adtb = { path = "crates/adtb" }
adtb-lang = { path = "crates/adtb-lang" }
adtb-isolation = { path = "crates/adtb-isolation" }
adtb-reference = { path = "crates/adtb-reference" }
adtb-sim = { path = "crates/adtb-sim" }
adtb-sys = { path = "crates/adtb-sys" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
disallowed_methods = "deny"

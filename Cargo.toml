[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["apps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
adtb = { path = "crates/adtb" }
adtb-codegen = { path = "crates/adtb-codegen" }
adtb-conformance = { path = "crates/adtb-conformance" }
adtb-heap-cap = { path = "crates/adtb-heap-cap" }
adtb-file = { path = "crates/adtb-file" }
adtb-lang = { path = "crates/adtb-lang" }
adtb-isolation = { path = "crates/adtb-isolation" }
adtb-reference = { path = "crates/adtb-reference" }
adtb-sim = { path = "crates/adtb-sim" }
adtb-simkit = { path = "crates/adtb-simkit" }
adtb-sys = { path = "crates/adtb-sys" }
adtb-testkit = { path = "crates/adtb-testkit" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
disallowed_methods = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
self_named_module_files = "deny"
let_underscore_must_use = "deny"
redundant_clone = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
manual_let_else = "deny"
unnested_or_patterns = "deny"
ignored_unit_patterns = "deny"
explicit_iter_loop = "deny"
redundant_closure_for_method_calls = "deny"
needless_raw_string_hashes = "deny"
cast_lossless = "deny"
match_same_arms = "deny"
stable_sort_primitive = "deny"
range_plus_one = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"

[profile.test]
opt-level = 1
debug = 0

[profile.dev]
debug = 0

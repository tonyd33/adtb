disallowed-methods = [
  { path = "std::time::Instant::now", reason = "time comes from the engine's clock interface" },
  { path = "std::time::SystemTime::now", reason = "time comes from the engine's clock interface" },
  { path = "std::thread::spawn", reason = "threads come from the engine's scheduler interface" },
  { path = "std::thread::Builder::spawn", reason = "threads come from the engine's scheduler interface" },
  { path = "std::process::Command::new", reason = "a test spawns through adtb_heap_cap::test_child, which caps the child to fit its slots" },
  { path = "adtb::storage::page::owner", reason = "the storage module owns page ownership; use its pager operations" },
  { path = "adtb::storage::pager::Pager::meta", reason = "the pager owns its metadata; use a pager operation" },
  { path = "adtb_sys::pages::Exclusive::write", reason = "a resident page changes only by a logged change or one of pager.rs's own writers" },
  { path = "adtb_sys::pages::PageMemory::lock_exclusive", reason = "pager.rs owns the exclusive latch; use Pager::exclusive or Pager::hold" },
  { path = "adtb_sys::pages::PageMemory::try_lock_exclusive", reason = "pager.rs owns the exclusive latch; use Pager::exclusive or Pager::hold" },
  { path = "adtb_sys::runtime::Ticket::new", reason = "a ticket is made only by a backend, for an op submitted to it" },
  { path = "adtb_sys::pages::Optimistic::upgrade", reason = "pager.rs owns the exclusive latch; use PageOptimistic::upgrade" },
]
allow-unwrap-in-tests = true
allow-print-in-tests = true
too-many-lines-threshold = 150
cognitive-complexity-threshold = 25

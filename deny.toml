# Each dependency gets an entry in [bans].allow with a justification
# comment. Once the list is non-empty, cargo deny check refuses any
# crate missing from it.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT"]
confidence-threshold = 0.9

# The Unicode data tables unicode-normalization embeds.
[[licenses.exceptions]]
crate = "unicode-normalization"
allow = ["Unicode-3.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
allow-workspace = true
allow = [
    # NFC normalization of text values.
    "unicode-normalization",
    # Inline buffers unicode-normalization requires.
    "tinyvec",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

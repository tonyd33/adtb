# Each dependency gets an entry in [bans].allow with a justification
# comment. Once the list is non-empty, cargo deny check refuses any
# crate missing from it.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    # The licence of the Unicode data tables and of the ICU4X crates.
    "Unicode-3.0",
    # BLAKE3 and its constant-time comparison are offered under Apache-2.0 among others.
    "Apache-2.0",
    # The licence of arrayref, a BLAKE3 dependency.
    "BSD-2-Clause",
    # The campaign router matchit combines MIT and BSD-3-Clause.
    "BSD-3-Clause",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
allow-workspace = true
# Remove when maud_macros and proc-macro2-diagnostics use syn 3.
skip = [{ name = "syn", version = "=2.0.119" }]
allow = [
    # NFC normalization of text values.
    "unicode-normalization",
    # Inline buffers unicode-normalization requires.
    "tinyvec",
    # Extended grapheme clusters for grapheme_len.
    "icu_segmenter",
    "icu_segmenter_data",
    # Full case mapping and folding for lower, upper and fold.
    "icu_casemap",
    "icu_casemap_data",
    # UTS #10 sort keys for collate.
    "icu_collator",
    "icu_collator_data",
    # The ICU4X core the three ICU4X crates above share: locales, locale fallback, data
    # providers, normalization and property tables, and their zero-copy containers.
    "icu_collections",
    "icu_locale_core",
    "icu_locale_fallback",
    "icu_locale_fallback_data",
    "icu_normalizer",
    "icu_normalizer_data",
    "icu_properties",
    "icu_properties_data",
    "icu_provider",
    "litemap",
    "potential_utf",
    "stable_deref_trait",
    "tinystr",
    "utf16_iter",
    "utf8_iter",
    "write16",
    "writeable",
    "yoke",
    "yoke-derive",
    "zerofrom",
    "zerofrom-derive",
    "zerotrie",
    "zerovec",
    "zerovec-derive",
    "smallvec",
    # Build-time derive macros of the ICU4X crates.
    "displaydoc",
    "proc-macro2",
    "quote",
    "syn",
    "synstructure",
    "unicode-ident",
    # RE2-syntax regular expressions for matches, in linear time.
    "regex",
    "regex-automata",
    "regex-syntax",
    # Zone rules for zoned, in_zone and to_instant, with the bundled time zone database.
    "jiff",
    "jiff-core",
    "jiff-tzdb",
    # Atomics jiff uses on targets without native ones.
    "portable-atomic",
    "portable-atomic-util",
    # BLAKE3-256 for the version hash of the operator log and the content hash of functions.
    "blake3",
    # Fixed-size array views and stack arrays BLAKE3 uses.
    "arrayref",
    "arrayvec",
    "constant_time_eq",
    # Compile-time platform selection, for BLAKE3 and io-uring.
    "cfg-if",
    # Runtime CPU feature detection for BLAKE3's SIMD paths.
    "cpufeatures",
    # The host's clocks, entropy and file system calls for adtb-sys's real runtime, and the
    # system interface cpufeatures reads CPU features through on some targets.
    "libc",
    # The io_uring submission and completion rings for adtb-sys's io_uring backend.
    "io-uring",
    # Typed flag sets io-uring builds its submission entries from.
    "bitflags",
    # Build-time compiler driver for BLAKE3's assembly, and what it uses.
    "cc",
    "find-msvc-tools",
    "shlex",
    # Local engine and test dependencies of the separately built campaign workspace.
    "adtb",
    "adtb-codegen",
    "adtb-file",
    "adtb-lang",
    "adtb-reference",
    "adtb-sim",
    "adtb-sys",
    "adtb-testkit",
    # Local campaign HTTP routing, forms, escaped HTML, async runtime and their dependencies.
    "atomic-waker",
    "axum",
    "axum-core",
    "bytes",
    "errno",
    "form_urlencoded",
    "futures-core",
    "futures-task",
    "futures-util",
    "http",
    "http-body",
    "http-body-util",
    "httparse",
    "httpdate",
    "hyper",
    "hyper-util",
    "itoa",
    "log",
    "matchit",
    "maud",
    "maud_macros",
    "memchr",
    "mime",
    "mio",
    "percent-encoding",
    "pin-project-lite",
    "proc-macro2-diagnostics",
    "ryu",
    "serde",
    "serde_core",
    "serde_derive",
    "serde_path_to_error",
    "serde_urlencoded",
    "signal-hook-registry",
    "slab",
    "socket2",
    "sync_wrapper",
    "tokio",
    "tokio-macros",
    "tower",
    "tower-layer",
    "tower-service",
    "version_check",
    "wasi",
    "windows-link",
    "windows-sys",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
